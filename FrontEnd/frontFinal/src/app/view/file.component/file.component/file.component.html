
<form id="formulario">
    <h3>Ingrese los datos de la película</h3>
    <div class="form-group">
        <label for="titulo">Ingrese el título</label>
        <input 
            id="titulo"
            type="text">
    </div>
    <div class="form-group">
        <label for="categorias">Ingrese las categorías</label>
        <input 
            id="categorias"
            type="text">
    </div>
    <div class="form-group"> 
        <label for="carpeta">Ingrese la carpeta</label>
        <input 
            id="carpeta"
            type="text">
    </div>
    <button type="submit" class="btn btn-primary">Crear</button>
</form>
