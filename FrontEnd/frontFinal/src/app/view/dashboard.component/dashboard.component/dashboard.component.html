<div class="dashboard-container">
     <div class="header-section">
            <div class="title-area">
                <h1> 🎬​ PELÍCULAS 🎞️​ </h1>
            </div>

            <div class="barras-busqueda">
                <div class="etiqueta">
                    <span class="search-icon">🔍</span>
                    <label for="etiquetas">Buscar por categoría</label>
                    <input 
                        id=etiquetas 
                        type="text"
                        [(ngModel)]="categoria"
                        (input)="busquedaTag()"
                        placeholder="Una o más etiquetas">
                </div>
            
                <div class="nombre">
                    <span class="search-icon">🔍</span>
                    <label for="bsqNombre">Buscar por nombre</label>
                    <input 
                        id=bsqNombre
                        type="text" 
                        [(ngModel)]="busqueda" 
                        (input)="busquedaNameFiles()">
                </div>
            </div>
     </div>

    <div class="row g-3 m-1">
        @for (file of filesTodo; track $index){
        <div class="col-12 col-sm-6 col-lg-3 ">
            <div class="card" style="width: 14rem;" name="carta">
                <h5 class="card-title text-center mb-2 m-1">{{file.filename}}</h5>

                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a3/Image-not-found.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original">

                <div class="card-body">
                    @for (etiqueta of filesTodo; track $index){
                        <p>Categorias: {{etiqueta.tag}} </p>
                    }
                </div>
            </div>
        </div>
        }
    </div>
</div>
